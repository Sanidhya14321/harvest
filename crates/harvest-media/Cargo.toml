[package]
name = "harvest-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared bounded document, image and terminal media conversion for Harvest"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
harvest-runtime = { path = "../harvest-runtime" }
regex.workspace = true
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
html-to-markdown-rs.workspace = true
resvg.workspace = true
icy_sixel.workspace = true
image = { workspace = true, features = ["bmp"] }
# The pinned JPEG decoder requires log even when only resvg uses it.
zune-jpeg.workspace = true

[dev-dependencies]
tempfile = "3"
