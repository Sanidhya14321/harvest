[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
anyhow.workspace = true
clap.workspace = true
harvest-runtime = { path = "../crates/harvest-runtime", version = "=0.1.0" }
harvest-protocol = { path = "../crates/harvest-protocol", version = "=0.1.0" }
harvest-web = { path = "../crates/harvest-web", version = "=0.1.0" }
regex.workspace = true
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
semver = "1"
toml_edit = "0.25"
tempfile = "3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "xtask"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
