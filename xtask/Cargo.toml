[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
harvest-protocol = { path = "../crates/harvest-protocol" }
harvest-web = { path = "../crates/harvest-web" }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
anyhow.workspace = true
clap.workspace = true
harvest-runtime = { path = "../crates/harvest-runtime" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
toml_edit = "0.25"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_yaml_ng = "0.10.0"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
