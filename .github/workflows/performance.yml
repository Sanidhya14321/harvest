name: Performance

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-comparison:
    name: Release comparison (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: omp
            budget: 20000000
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: omp
            budget: 20000000
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: omp
            budget: 20000000
          - os: macos-14
            target: aarch64-apple-darwin
            binary: omp
            budget: 20000000
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: omp.exe
            budget: 20000000
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust-agent
    env:
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      BUDGET: ${{ matrix.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: performance-${{ matrix.target }}
      - name: Build the release binary
        run: cargo build --release --locked --target "${TARGET}"
      - name: Smoke test and enforce the size budget
        shell: bash
        run: |
          set -euo pipefail
          artifact="target/${TARGET}/release/${BINARY}"
          OMP_SKIP_INTEGRATIONS=1 "./${artifact}" --version
          if [ "${RUNNER_OS}" = "Windows" ]; then
            size=$(stat -c %s "${artifact}" 2>/dev/null || wc -c < "${artifact}")
          else
            size=$(wc -c < "${artifact}" | tr -d '[:space:]')
          fi
          echo "release binary: ${size} bytes (budget ${BUDGET})"
          test "${size}" -le "${BUDGET}"
