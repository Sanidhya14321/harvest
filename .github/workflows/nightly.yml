name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  full-check:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install authoritative workspace toolchain
        run: rustup show
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Formatting
        run: cargo fmt -p harvest-protocol -p harvest-web -p harvest-runtime -p harvest-brain -p harvest-terminal -p harvest-terminal-wasm -p harvest-omp -p xtask -- --check
      - name: Lint
        run: cargo clippy --locked -p harvest-protocol -p harvest-web -p harvest-runtime -p harvest-brain -p harvest-terminal -p harvest-terminal-wasm -p harvest-omp -p xtask --all-targets --all-features -- -D warnings
      - name: Nextest and doctests
        run: cargo xtask test -p harvest-protocol -p harvest-web -p harvest-runtime -p harvest-brain -p harvest-terminal -p harvest-terminal-wasm -p harvest-omp -p xtask --all-features

  future-toolchain:
    name: Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml so this job actually exercises the
      # requested compatibility toolchain instead of the workspace pin.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Confirm the compatibility toolchain
        run: rustup show active-toolchain
      - run: cargo clippy --locked -p harvest-protocol -p harvest-web -p harvest-runtime -p harvest-brain -p harvest-terminal -p harvest-terminal-wasm -p harvest-omp -p xtask --all-targets --all-features -- -D warnings
      - name: Nextest and doctests
        run: cargo xtask test -p harvest-protocol -p harvest-web -p harvest-runtime -p harvest-brain -p harvest-terminal -p harvest-terminal-wasm -p harvest-omp -p xtask --all-features
