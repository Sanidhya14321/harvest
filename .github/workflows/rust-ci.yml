name: Rust CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust-agent

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo fmt (nightly style rules)
        env:
          NIGHTLY_RULES: >-
            group_imports=StdExternalCrate,imports_granularity=Module,
            reorder_impl_items=true,normalize_comments=true,
            format_code_in_doc_comments=true,format_macro_matchers=true,
            condense_wildcard_suffixes=true
        run: |
          set -euo pipefail
          rules=$(printf '%s' "${NIGHTLY_RULES}" | tr -d ' ')
          cargo fmt --all -- --check --unstable-features --config "${rules}"

  clippy:
    name: Clippy (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain != 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: clippy-${{ matrix.toolchain }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: test-${{ matrix.os }}
      - name: Tests
        run: cargo nextest run --all-features --locked --no-fail-fast
      - name: Tests (release)
        run: cargo nextest run --all-features --locked --release --no-fail-fast
      - name: Release build
        run: cargo build --release --locked

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo doc
        env:
          RUSTDOCFLAGS: >-
            -D warnings
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::private_intra_doc_links
            -D rustdoc::invalid_codeblock_attributes
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls
        run: cargo doc --no-deps --all-features --document-private-items --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: MSRV matches Cargo.toml
        run: |
          set -euo pipefail
          declared=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].rust_version')
          test "${declared}" = 1.88
      - run: cargo check --all-targets --all-features --locked

  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: make hack

  cross:
    name: Cross build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: cross-${{ matrix.target }}
      - name: Check
        env:
          TARGET: ${{ matrix.target }}
        run: cargo check --locked --all-features --target "${TARGET}"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Measure coverage
        run: cargo llvm-cov --all-features --locked --no-report
      - name: Report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Enforce the floor
        run: cargo llvm-cov report --fail-under-lines 65
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-lcov
          path: rust-agent/lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: rust-agent/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  package:
    name: Package and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo package --locked
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
      - run: cargo install --path . --locked --root /tmp/omp-install
      - name: Cargo installation creates completions on first use
        run: |
          HOME="${RUNNER_TEMP}/omp-home" XDG_DATA_HOME="${RUNNER_TEMP}/omp-data" SHELL=/bin/bash \
            PATH="/tmp/omp-install/bin:${PATH}" /tmp/omp-install/bin/omp --version
          test -s "${RUNNER_TEMP}/omp-data/bash-completion/completions/omp"
          test -L /tmp/omp-install/bin/harvest
          HOME="${RUNNER_TEMP}/omp-home" XDG_DATA_HOME="${RUNNER_TEMP}/omp-data" SHELL=/bin/bash \
            PATH="/tmp/omp-install/bin:${PATH}" harvest --version
          test -s "${RUNNER_TEMP}/omp-home/.local/state/omp/bash-installed"
          test -s "${RUNNER_TEMP}/omp-home/.local/state/omp/shortcut-installed"
      - run: /tmp/omp-install/bin/omp --help >/dev/null
      - name: Binary stays under the size budget
        env:
          BUDGET_BYTES: 20971520
        run: |
          set -euo pipefail
          size=$(stat -c %s /tmp/omp-install/bin/omp)
          echo "release binary: ${size} bytes (budget ${BUDGET_BYTES})"
          test "${size}" -le "${BUDGET_BYTES}"

  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Shell installer
        if: runner.os != 'Windows'
        run: sh tests/install.sh
      - name: Root container-style shell installer
        if: runner.os == 'Linux'
        run: sudo env PATH="${PATH}" OMP_TEST_ROOT_DEFAULT=1 sh tests/install.sh
      - name: PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.ps1

  homebrew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Formula templates render without a published release
        run: |
          set -euo pipefail
          python3 scripts/homebrew_formula.py --selftest
          sh scripts/update_homebrew_tap.sh --selftest
      - name: Look for a published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null)
          status=$?
          set -e
          if [ "${status}" -ne 0 ] || [ -z "${tag}" ]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Set up Homebrew
        if: steps.release.outputs.present == 'true'
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Render the formula for the latest release
        if: steps.release.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version=${tag#v}
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS --dir "${RUNNER_TEMP}"
          python3 scripts/homebrew_formula.py --version "${version}" \
            --checksums "${RUNNER_TEMP}/SHA256SUMS" \
            --output "${RUNNER_TEMP}/omp.rb"
      - name: Stage the formula in a test tap
        if: steps.release.outputs.present == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          brew tap-new "${GITHUB_REPOSITORY_OWNER}/tap"
          sh scripts/update_homebrew_tap.sh "${RUNNER_TEMP}/omp.rb" \
            "$(brew --repository "${GITHUB_REPOSITORY_OWNER}/tap")" test-release
      - name: Install the formula
        if: steps.release.outputs.present == 'true'
        run: brew install "${GITHUB_REPOSITORY_OWNER}/tap/omp"
      - name: Verify the installation
        if: steps.release.outputs.present == 'true'
        run: |
          set -euo pipefail
          prefix=$(brew --prefix omp)
          test -x "${prefix}/bin/omp"
          test -L "${prefix}/bin/harvest"
          omp --version
          harvest --version

  ci:
    name: CI
    if: always()
    needs:
      - format
      - clippy
      - test
      - docs
      - msrv
      - features
      - cross
      - coverage
      - package
      - installers
      - homebrew
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "every required check passed"
