name: Rust CI
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  checks:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install authoritative workspace toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt -p harvest-runtime -p harvest-brain -p harvest-omp -p xtask -- --check
      - run: cargo clippy --locked -p harvest-runtime -p harvest-brain -p harvest-omp -p xtask --all-targets --all-features -- -D warnings
      - run: cargo xtask capabilities
  test:
    name: Contracts (${{ matrix.os }}, ${{ matrix.features }})
    defaults:
      run:
        shell: bash
    env:
      FEATURES: ${{ matrix.features }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        features: [core, full]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: test-${{ matrix.os }}-${{ matrix.features }}
      - run: cargo xtask test -p harvest-runtime -p harvest-brain -p harvest-omp --no-default-features --features "${FEATURES}"
      - name: Release-profile contracts
        run: cargo xtask test -p harvest-runtime -p harvest-brain -p harvest-omp --release --no-default-features --features "${FEATURES}"
      - run: cargo build --locked -p harvest-omp --no-default-features --features "${FEATURES}"
      - run: cargo run --locked -p harvest-omp --bin harvest -- --help
      - run: cargo run --locked -p harvest-omp --bin omp -- brain --scope project organize --dry-run --json

  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Shell installer contracts
        if: runner.os != 'Windows'
        run: sh tests/install.sh
      - name: PowerShell installer contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.ps1

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo doc
        env:
          RUSTDOCFLAGS: >-
            -D warnings
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::private_intra_doc_links
            -D rustdoc::invalid_codeblock_attributes
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls
        run: >-
          cargo doc -p harvest-runtime -p harvest-brain -p harvest-omp -p xtask
          --no-deps --all-features --document-private-items --locked


  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo hack check -p harvest-omp --feature-powerset --locked


  cross:
    name: Cross build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: cross-${{ matrix.target }}
      - name: Check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "${TARGET}"
          cargo check -p harvest-omp --locked --all-features --target "${TARGET}"


  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: rustup component add llvm-tools-preview
      - name: Measure coverage
        run: cargo llvm-cov nextest -p harvest-runtime -p harvest-brain -p harvest-omp -p xtask --all-features --locked --no-report
      - name: Report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Enforce the floor
        run: cargo llvm-cov report --fail-under-lines 65
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-lcov
          path: lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


  package:
    name: Package and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo package -p harvest-omp --list --locked
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
      - run: cargo install --path rust-agent --locked --root /tmp/omp-install
      - name: Installed aliases run without implicit setup
        run: |
          /tmp/omp-install/bin/omp --version
          /tmp/omp-install/bin/harvest --version
          /tmp/omp-install/bin/harvest brain --scope project organize --dry-run --json
      - run: /tmp/omp-install/bin/omp --help >/dev/null
      - name: Binary stays under the size budget
        env:
          BUDGET_BYTES: 20971520
        run: |
          set -euo pipefail
          size=$(stat -c %s /tmp/omp-install/bin/omp)
          echo "release binary: ${size} bytes (budget ${BUDGET_BYTES})"
          test "${size}" -le "${BUDGET_BYTES}"


  homebrew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-nextest
      - name: Formula templates render without a published release
        run: |
          set -euo pipefail
          cargo xtask test -p xtask
          sh rust-agent/scripts/update_homebrew_tap.sh --selftest
      - name: Look for a published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null)
          status=$?
          set -e
          if [ "${status}" -ne 0 ] || [ -z "${tag}" ]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' | grep -qx "omp-linux-x86_64"; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Set up Homebrew
        if: steps.release.outputs.present == 'true'
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
      - name: Render the formula for the latest release
        if: steps.release.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version=${tag#v}
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS --dir homebrew-release
          cargo xtask package homebrew --version "${version}" \
            --checksums homebrew-release/SHA256SUMS \
            --output homebrew-release/omp.rb
      - name: Stage the formula in a test tap
        if: steps.release.outputs.present == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          brew tap-new "${GITHUB_REPOSITORY_OWNER}/tap"
          sh rust-agent/scripts/update_homebrew_tap.sh homebrew-release/omp.rb \
            "$(brew --repository "${GITHUB_REPOSITORY_OWNER}/tap")" test-release
      - name: Install the formula
        if: steps.release.outputs.present == 'true'
        run: brew install "${GITHUB_REPOSITORY_OWNER}/tap/omp"
      - name: Verify the installation
        if: steps.release.outputs.present == 'true'
        run: |
          set -euo pipefail
          prefix=$(brew --prefix omp)
          test -x "${prefix}/bin/omp"
          test -L "${prefix}/bin/harvest"
          omp --version
          harvest --version


  toolchain:
    name: Authoritative workspace toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo xtask check -p harvest-runtime -p harvest-brain -p harvest-omp -p xtask --all-features

  ci:
    name: Rust CI
    if: always()
    needs: [checks, test, installers, docs, features, cross, coverage, package, homebrew, toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
