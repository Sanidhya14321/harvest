name: Release

on:
  push:
    branches: [main]
    paths:
      - rust-agent/src/**
      - rust-agent/Cargo.toml
      - rust-agent/Cargo.lock
      - rust-agent/README.md
      - rust-agent/Formula/omp.rb
      - rust-agent/packaging/winget/**
      - rust-agent/scripts/homebrew_formula.py
      - rust-agent/scripts/update_homebrew_tap.sh
      - rust-agent/scripts/winget_manifest.py
      - .github/workflows/rust-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: rust-agent

jobs:
  version:
    name: Bump version and tag
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    environment: pukbot-production
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Choose the next patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<<"${current}"
          for _ in $(seq 1 100); do
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A omp-release "https://crates.io/api/v1/crates/harvest-omp/${next}")
            case "${code}" in
              404) ;;
              200) continue ;;
              *) echo "unexpected crates.io status ${code} for ${next}" >&2; exit 1 ;;
            esac
            if git -C "${GITHUB_WORKSPACE}" rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then continue; fi
            echo "version=${next}" >>"${GITHUB_OUTPUT}"
            echo "tag=v${next}" >>"${GITHUB_OUTPUT}"
            echo "releasing ${current} -> ${next}"
            exit 0
          done
          echo "no free patch version after ${current}" >&2
          exit 1
      - name: Apply the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --workspace
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')" = "${VERSION}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - name: Commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name 'pukbot[bot]'
          git config user.email '320458784+pukbot[bot]@users.noreply.github.com'
          git add rust-agent/Cargo.toml rust-agent/Cargo.lock
          git commit -m "chore: release v${VERSION} [skip ci]"
      - run: cargo package --locked
      - name: Publish the release commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "omp v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: omp-linux-x86_64
            binary: omp
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: omp-linux-aarch64
            binary: omp
            deb_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: omp-macos-x86_64
            binary: omp
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: omp-macos-aarch64
            binary: omp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: omp-windows-x86_64.exe
            binary: omp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: cp "target/${TARGET}/release/${BINARY}" "${ARTIFACT}"
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: Copy-Item "target/$env:TARGET/release/$env:BINARY" "$env:ARTIFACT"
      - name: Smoke test artifact (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: OMP_SKIP_INTEGRATIONS=1 "./${ARTIFACT}" --version
      - name: Smoke test artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: $env:OMP_SKIP_INTEGRATIONS = '1'; & "./$env:ARTIFACT" --version
      - name: Build Debian package
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/omp"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" completions bash > "target/${TARGET}/release/omp.bash"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" completions fish > "target/${TARGET}/release/omp.fish"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" completions zsh > "target/${TARGET}/release/omp.zsh"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" man > "target/${TARGET}/release/omp.1"
          cargo install cargo-deb --version 3.7.0 --locked
          cargo deb --no-build --no-strip --target "${TARGET}" --output "omp_${VERSION}_${DEB_ARCH}.deb"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.artifact }}
          path: rust-agent/${{ matrix.artifact }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: runner.os == 'Linux'
        with:
          name: omp-deb-${{ matrix.deb_arch }}
          path: rust-agent/omp_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb

  publish-crate:
    name: Publish crate
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          lookup-only: true
      - name: Check crate version
        id: crate
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A omp-release "https://crates.io/api/v1/crates/harvest-omp/${VERSION}")
          test "${code}" = 200 || test "${code}" = 404
          if [ "${code}" = 404 ]; then echo "publish=true" >>"${GITHUB_OUTPUT}"; fi
      - name: Publish to crates.io
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  release:
    name: Publish GitHub release
    needs: [version, build, publish-crate]
    runs-on: ubuntu-latest
    environment: pukbot-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: dist
          merge-multiple: true
      - name: Prepare Winget archive
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/winget-archive"
          mkdir "${archive}"
          cp dist/omp-windows-x86_64.exe "${archive}/omp.exe"
          cp dist/omp-windows-x86_64.exe "${archive}/harvest.exe"
          (cd "${archive}" && zip -9 "${GITHUB_WORKSPACE}/dist/omp-windows-x86_64.zip" ./*.exe)
      - name: Generate checksums
        working-directory: dist
        run: sha256sum omp-* > SHA256SUMS
      - name: Render Winget manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          manifests="${RUNNER_TEMP}/winget-manifests"
          python3 rust-agent/scripts/winget_manifest.py \
            --version "${VERSION}" \
            --release-date "$(date -u +%F)" \
            --checksums dist/SHA256SUMS \
            --output-dir "${manifests}"
          (cd "${manifests}" && zip -9 "${GITHUB_WORKSPACE}/dist/omp-winget-manifests.zip" ./*.yaml)
          (cd dist && sha256sum omp-* >SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
      - name: Render the Homebrew formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 rust-agent/scripts/homebrew_formula.py \
            --version "${VERSION}" --checksums dist/SHA256SUMS --output omp.rb
      - name: Mirror the formula to the tap repository
        env:
          PUKBOT_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${PUKBOT_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          sh rust-agent/scripts/update_homebrew_tap.sh omp.rb tap "${TAG}"
          git -C tap push origin HEAD:main
