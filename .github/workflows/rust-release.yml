name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: ${{ github.workspace }}

jobs:
  parity:
    name: Require complete Rust capability parity before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install authoritative workspace toolchain
        working-directory: ${{ github.workspace }}
        run: rustup show
      - name: Distribution cutover gate
        working-directory: ${{ github.workspace }}
        run: |
          if test -f .github/workflows/release.yml; then
            echo "distribution cutover blocked: legacy release workflow still owns release tags" >&2
            exit 1
          fi
          cargo xtask clippy-config --check
          cargo xtask theme-index --check
          cargo xtask migration --require-complete
          cargo xtask capabilities --require-complete
  version:
    needs: parity
    name: Bump version and tag
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    environment: pukbot-production
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Resolve shipping targets
        id: matrix
        run: echo "value=$(cargo xtask package matrix)" >>"${GITHUB_OUTPUT}"
      - name: Choose the next patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(cargo xtask version)
          echo "current=${current}" >>"${GITHUB_OUTPUT}"
          IFS=. read -r major minor patch <<<"${current}"
          for _ in $(seq 1 100); do
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A omp-release "https://crates.io/api/v1/crates/harvest-omp/${next}")
            case "${code}" in
              404) ;;
              200) continue ;;
              *) echo "unexpected crates.io status ${code} for ${next}" >&2; exit 1 ;;
            esac
            if git -C "${GITHUB_WORKSPACE}" rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then continue; fi
            echo "version=${next}" >>"${GITHUB_OUTPUT}"
            echo "tag=v${next}" >>"${GITHUB_OUTPUT}"
            echo "releasing ${current} -> ${next}"
            exit 0
          done
          echo "no free patch version after ${current}" >&2
          exit 1
      - name: Apply the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          CURRENT: ${{ steps.bump.outputs.current }}
        run: |
          set -euo pipefail
          cargo xtask version --set "${VERSION}" --expect "${CURRENT}"
          cargo update --workspace
          test "$(cargo xtask version)" = "${VERSION}"
      - run: cargo fmt --all -- --check
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest
      - run: cargo clippy -p harvest-omp -p harvest-tui -p xtask --all-targets --all-features --locked -- -D warnings
      - run: cargo xtask test -p harvest-omp -p harvest-tui -p xtask --all-features
      - name: Commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name 'pukbot[bot]'
          git config user.email '320458784+pukbot[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${VERSION} [skip ci]"
      - run: cargo package -p harvest-omp --locked
      - name: Publish the release commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "omp v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2
        if: matrix.bazel_target != ''
      - name: Build GNU application with the pinned portability toolchain
        if: matrix.bazel_target != ''
        shell: bash
        env:
          BAZEL_TARGET: ${{ matrix.bazel_target }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          bazel build "//:${BAZEL_TARGET}" --jobs=2
          mkdir -p "target/${TARGET}/release"
          cp "bazel-bin/${BAZEL_TARGET}/omp" "target/${TARGET}/release/${BINARY}"
          cargo xtask package verify-glibc --binary "target/${TARGET}/release/${BINARY}" --max-glibc 2.17
      - name: Build on the native target
        if: matrix.bazel_target == ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build -p harvest-omp --bins --release --locked --target "${TARGET}"
      - name: Verify the AArch64 CPU erratum workaround
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          bazel build //bazel/tests:aarch64-erratum //bazel/tests:aarch64-erratum-unfixed --platforms=//bazel/platforms:linux-arm64 --jobs=2
          bazel-bin/bazel/tests/aarch64-erratum
          set +e
          bazel-bin/bazel/tests/aarch64-erratum-unfixed
          status=$?
          set -e
          test "${status}" -eq 1
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: cp "target/${TARGET}/release/${BINARY}" "${ARTIFACT}"
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: Copy-Item "target/$env:TARGET/release/$env:BINARY" "$env:ARTIFACT"
      - name: Smoke test artifact (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: OMP_SKIP_INTEGRATIONS=1 "./${ARTIFACT}" --version
      - name: Smoke test artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: $env:OMP_SKIP_INTEGRATIONS = '1'; & "./$env:ARTIFACT" --version
      - name: Package both aliases and legal notices
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: cargo xtask package archive --target "${TARGET}" --binary "target/${TARGET}/release/${BINARY}" --output-dir .
      - name: Build Debian package
        if: matrix.deb_arch != ''
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/omp"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" completions bash > "target/${TARGET}/release/omp.bash"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" completions fish > "target/${TARGET}/release/omp.fish"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" completions zsh > "target/${TARGET}/release/omp.zsh"
          OMP_SKIP_INTEGRATIONS=1 "${binary}" man > "target/${TARGET}/release/omp.1"
          cargo install cargo-deb --version 3.7.0 --locked
          cargo deb --manifest-path rust-agent/Cargo.toml --no-build --no-strip --target "${TARGET}" --output "omp_${VERSION}_${DEB_ARCH}.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            omp-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.deb_arch != ''
        with:
          name: omp-deb-${{ matrix.deb_arch }}
          path: omp_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb

  publish-crate:
    name: Publish crate
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          lookup-only: true
      - name: Check crate version
        id: crate
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A omp-release "https://crates.io/api/v1/crates/harvest-omp/${VERSION}")
          test "${code}" = 200 || test "${code}" = 404
          if [ "${code}" = 404 ]; then echo "publish=true" >>"${GITHUB_OUTPUT}"; fi
      - name: Publish to crates.io
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p harvest-omp --locked

  release:
    name: Publish GitHub release
    needs: [version, build, publish-crate]
    runs-on: ubuntu-latest
    environment: pukbot-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Validate the complete shipping artifact set
        run: cargo xtask package verify-assets --directory dist
      - name: Generate checksums
        run: cargo xtask checksums dist/SHA256SUMS.txt dist/omp-*
      - name: Render Winget manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo xtask package winget \
            --version "${VERSION}" \
            --release-date "$(date -u +%F)" \
            --checksums dist/SHA256SUMS.txt \
            --archive-output dist/omp-winget-manifests.zip
          cargo xtask checksums dist/SHA256SUMS.txt dist/omp-*
      - name: Generate curated release notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: cargo xtask release-notes "${RELEASE_TAG}" release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body_path: release-notes.md
          files: dist/*
      - name: Render the Homebrew formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo xtask package homebrew \
            --version "${VERSION}" --checksums dist/SHA256SUMS.txt --output omp.rb
      - name: Mirror the formula to the tap repository
        env:
          PUKBOT_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${PUKBOT_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          sh rust-agent/scripts/update_homebrew_tap.sh omp.rb tap "${TAG}"
          git -C tap push origin HEAD:main
