name: CI

# Continuous integration for Sanidhya14321/harvest.
# Runs on pushes to main and on pull requests.
#
# Release commits (`chore: bump version to vX.Y.Z`, pushed by
# `bun scripts/release.ts`) get a per-SHA, never-cancel group so retries that
# keep the same subject don't cancel each other (#2564). Everything else
# shares a per-ref group that cancels superseded PR runs.
#
# What runs where:
#   check-ts   — oxlint + oxfmt + tsgo gate over the SHIPPED packages, plus
#                the generated clippy-bazelrc drift check. Private workspace
#                members are excluded: metaharness is a benchmark harness
#                whose root tsconfig type-checks sibling sources under DOM
#                libs, producing 60+ pre-existing errors (Uint8Array/
#                MessageEvent strictness) that do not exist under each
#                package's own tsconfig and do not affect runtime. Scoping the
#                gate to shipped code keeps CI honest instead of red; the full
#                `bun run check:ts` remains available locally and the harness
#                debt is tracked for a tsconfig split.
#   scripts    — release/checksum/publish/test-runner unit tests (fast, no Rust).
#   check-rs   — cargo fmt --check + clippy -D warnings, including pull requests.
#   ts-workspace + smoke — host native build, then fast workspace and native/UI
#                integration buckets (including stats, metaharness, robomp-web),
#                ownership contracts and the CLI smoke probe. Full agent suites
#                (`bun run ci:test:full`, `bun run test:rs`,
#                `ci:test:install-methods`) stay manual / pre-release gates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ contains(github.event.head_commit.message, 'chore: bump version to v') && github.sha || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Lint + format gate (whole tree)
        run: bun run check:tools
      - name: Typecheck shipped packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in agent ai catalog coding-agent mnemopi natives omptype snapcompact stats tui utils wire; do
            echo "--- check:types packages/$pkg"
            bun --cwd="packages/$pkg" run check:types
          done
      - name: Clippy bazelrc drift check
        run: bun scripts/gen-clippy-bazelrc.ts --check

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Release/script unit tests
        run: bun test scripts/ci-test-ts.test.ts scripts/ci-release-build-binaries.test.ts scripts/musl-release.test.ts scripts/ci-release-publish.test.ts scripts/release.test.ts

  check-rs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
      - name: cargo fmt --check + clippy
        run: bun scripts/run-rs-task.ts check:rs

  ts-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
      - run: bun install --frozen-lockfile
      - name: Build host native addon
        run: bun run build:native
      - name: Fast TS workspace tests
        run: bun scripts/ci-test-ts.ts workspace
      - name: Native and UI connection integration tests
        env:
          OMP_TEST_CONCURRENCY: '1'
          OMP_TEST_CHUNK_TIMEOUT: '600'
        run: bun scripts/ci-test-ts.ts native
      - name: Terminal native-boundary contracts
        run: >-
          bun test packages/tui/test/fuzzy*.test.ts packages/tui/test/sgr-coalesce.test.ts
          packages/tui/test/native-terminal-output.test.ts packages/tui/test/issue-2034-repro.test.ts
          packages/tui/test/stdin-buffer.test.ts packages/tui/test/keys.test.ts
          packages/tui/test/portable-terminal.test.ts packages/tui/test/portable-terminal-install.test.ts
          packages/tui/test/native-terminal-input.test.ts
          packages/tui/test/container-memo.test.ts packages/tui/test/issue-8318-repro.test.ts
          packages/tui/test/history-frame-plan.test.ts packages/tui/test/output-backpressure-gate.test.ts
          packages/tui/test/input-priority.test.ts packages/tui/test/resize-anchor-recovery.test.ts
      - name: Build Rust session owner
        run: cargo build --locked -p harvest-omp --bin omp
      - name: TypeScript and Rust session ownership handoff
        env:
          HARVEST_RUST_OMP: target/debug/omp
        run: bun test scripts/rust-session-ownership.test.ts
      - name: CLI smoke probe
        run: bun run ci:test:smoke
