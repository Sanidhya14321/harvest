name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64, native: linux-x64-baseline }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, native: host }
          - { runner: ubuntu-24.04, target: linux-musl-x64, native: linux-musl-x64-baseline }
          - { runner: ubuntu-24.04-arm, target: linux-musl-arm64, native: linux-musl-arm64 }
          - { runner: macos-15-intel, target: darwin-x64, native: darwin-x64-baseline }
          - { runner: macos-15-arm64, target: darwin-arm64, native: host }
          - { runner: ubuntu-24.04, target: win32-x64, native: win32-x64-baseline }
          - { runner: windows-11-arm, target: win32-arm64, native: host }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
      - name: Check tag matches package version
        run: bun -e 'const pkg = await Bun.file("packages/coding-agent/package.json").json(); if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) throw new Error("Release tag does not match coding-agent version");'
      - run: bun install --frozen-lockfile
      - name: Build native addon
        run: bun scripts/bazel-natives.ts ${{ matrix.native }} --dest packages/natives/native
      - name: Build release binary
        run: bun scripts/ci-release-build-binaries.ts --targets ${{ matrix.target }}
      - name: Check binary on its target host
        shell: bash
        run: |
          binary="packages/coding-agent/binaries/omp-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="${binary/win32/windows}.exe"; fi
          "$binary" --version
          "$binary" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: packages/coding-agent/binaries/omp-*
          if-no-files-found: error
          retention-days: 1

  sidecar-smoke:
    # CPU sidecar proof (P2-10/F9): health identity, authenticated inference,
    # token rotation, teardown. Linux + Windows are gated here.
    #
    # macOS sidecar: intentionally NOT matrixed (documented skip). The smoke
    # script installs torch from the CPU-only wheel index, whose macOS
    # availability on a clean runner is unverified — gating on it risks
    # false-red releases. darwin-x64/arm64 compiled binaries ARE gated above
    # (including --smoke-test). Manual gate on a clean mac host:
    #   bash scripts/ci-sidecar-smoke.sh
    # (LAYA_SMOKE_PORT/LAYA_SMOKE_DIR as needed; the script is macOS-safe).
    # Re-enable by adding `- { runner: macos-15-arm64, cache: ~/.cache/huggingface }`
    # below once the CPU torch install proves green there.
    #
    # Offline behavior note: full-network-offline CI is intentionally not
    # gated (runner network isolation is flaky, and a cold cache needs network
    # for the one-time model download). Cache-only operation IS supported:
    # with a warm HF cache, HF_HUB_OFFLINE=1 forces cache-only model load and
    # the sidecar serves /health + /v1/decide with zero network. When the
    # model is absent and unreachable, the server stays unready and the TS
    # client fails open per contract (tool gating fails CLOSED to human
    # approval). Manual gate on a warm-cache host:
    #   HF_HUB_OFFLINE=1 bash scripts/ci-sidecar-smoke.sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, cache: ~/.cache/huggingface }
          - { runner: windows-2022, cache: ~\.cache\huggingface }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache the pinned checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: laya-typed-decisions-${{ hashFiles('decision-sidecar/requirements.txt') }}
      - name: CPU sidecar smoke (health, decide, token rotation, teardown)
        shell: bash
        run: bash scripts/ci-sidecar-smoke.sh

  npm-bundle:
    # Source-vs-npm leg (P2-10): prove the packed npm tarball — the artifact
    # npm consumers install — carries the release version and a bootable
    # bundled CLI identical to the source checkout the binaries are built
    # from. The unpacked tree runs from inside the checkout so the bundle's
    # external imports resolve via workspace node_modules: the @harvest scope
    # is not published to the public registry, so a fresh-registry consumer
    # install stays a manual release gate, not an automated one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Check tag matches package version
        run: bun -e 'const pkg = await Bun.file("packages/coding-agent/package.json").json(); if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) throw new Error("Release tag does not match coding-agent version");'
      - run: bun install --frozen-lockfile
      - name: Pack npm tarball and smoke-test the bundled CLI
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf npm-consumer-check packages/coding-agent/*.tgz' EXIT
          pushd packages/coding-agent >/dev/null
          bun pm pack
          popd >/dev/null
          shopt -s nullglob
          tarballs=( packages/coding-agent/*.tgz )
          shopt -u nullglob
          test "${#tarballs[@]}" -eq 1 || { echo "expected one packed tarball, found ${#tarballs[@]}"; exit 1; }
          test -s "${tarballs[0]}"
          rm -rf npm-consumer-check
          mkdir -p npm-consumer-check
          tar -xzf "${tarballs[0]}" -C npm-consumer-check
          PKG="npm-consumer-check/package"
          test -s "$PKG/package.json"
          test -s "$PKG/dist/cli.js"
          test -s "$PKG/dist/docs-index.generated.txt"
          shopt -s nullglob
          toolviews=( "$PKG"/dist/tool-views.generated-*.js )
          shopt -u nullglob
          test "${#toolviews[@]}" -ge 1 || { echo "packed tarball missing tool-views bundle"; exit 1; }
          SRC_VERSION="$(bun -e 'console.log((await Bun.file("packages/coding-agent/package.json").json()).version)')"
          PKG_VERSION="$(PKG_DIR="$PKG" bun -e 'console.log((await Bun.file(Bun.env.PKG_DIR + "/package.json").json()).version)')"
          test "$SRC_VERSION" = "$PKG_VERSION" || { echo "packed version $PKG_VERSION != source $SRC_VERSION"; exit 1; }
          CLI_VERSION="$(bun "$PKG/dist/cli.js" --version)"
          echo "$CLI_VERSION" | grep -q "$SRC_VERSION" || { echo "bundled CLI reports '$CLI_VERSION', want version $SRC_VERSION"; exit 1; }
          echo "npm bundle ok: tarball ${tarballs[0]}, version $SRC_VERSION, CLI '$CLI_VERSION'"

  publish:
    needs: [binaries, sidecar-smoke, npm-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete asset set and prepare legal files
        shell: bash
        run: |
          set -euo pipefail
          for asset in omp-linux-x64 omp-linux-arm64 omp-linux-musl-x64 omp-linux-musl-arm64 omp-darwin-x64 omp-darwin-arm64 omp-windows-x64.exe omp-windows-arm64.exe; do
            test -s "release-assets/$asset"
          done
          cp LICENSE release-assets/LICENSE
          cp THIRD-PARTY-NOTICES.txt release-assets/THIRD-PARTY-NOTICES.txt
          bun scripts/ci-release-checksums.ts release-assets/SHA256SUMS.txt release-assets/omp-* release-assets/LICENSE release-assets/THIRD-PARTY-NOTICES.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
