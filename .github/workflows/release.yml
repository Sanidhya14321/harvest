name: Public release

# Tags and manual requests share rust-release.yml. That workflow owns the
# single publishing lock, readiness gates and immutable candidate artifacts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  distribution:
    name: Rust distribution
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/rust-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
