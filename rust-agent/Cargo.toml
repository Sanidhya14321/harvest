[package]
name = "harvest-omp"
version.workspace = true
edition.workspace = true
description = "Rust coding agent for Harvest"
repository = "https://github.com/Sanidhya14321/harvest"
homepage = "https://github.com/Sanidhya14321/harvest"
documentation = "https://github.com/Sanidhya14321/harvest/tree/main/rust-agent"
readme = "README.md"
license.workspace = true
keywords = ["agent", "cli", "coding", "harvest", "llm"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/", "target/"]

# Each ZIP carries both real aliases. Per-target URLs follow cargo-binstall's
# documented overrides: https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
# Unpromised targets may fall back to a source build, not an unrelated binary.
pkg-url = "{ repo }/releases/download/v{ version }/omp-{ target }.zip"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/omp-linux-x64.zip"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/omp-linux-arm64.zip"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/omp-linux-musl-x64.zip"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/omp-linux-musl-arm64.zip"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/omp-darwin-x64.zip"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/omp-darwin-arm64.zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/omp-windows-x64.zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/omp-windows-arm64.zip"

[package.metadata.deb]
maintainer = "Harvest Contributors <harvest@users.noreply.github.com>"
copyright = "2026, Harvest Contributors"
extended-description = "omp is the Rust coding agent for Harvest. It reads and edits a workspace, runs shell commands, and talks to an OpenAI-compatible model."
section = "devel"
priority = "optional"
revision = ""

[[bin]]
name = "omp"
path = "src/main.rs"

[[bin]]
name = "harvest"
path = "src/bin/harvest.rs"

[features]
default = ["full"]
core = []
full = ["core", "dep:pi-shell", "dep:flume"]

[dependencies]
base64.workspace = true
harvest-browser = { path = "../crates/harvest-browser" }
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap.workspace = true
clap_complete = "4.5.65"
clap_mangen = "0.2.31"
flume = { workspace = true, optional = true }
harvest-brain = { path = "../crates/harvest-brain" }
harvest-runtime = { path = "../crates/harvest-runtime" }
harvest-tui = { path = "../crates/harvest-tui" }
harvest-media = { path = "../crates/harvest-media" }
harvest-tokenizer = { path = "../crates/harvest-tokenizer" }
pi-diff = { path = "../crates/pi-diff" }
pi-edit = { path = "../crates/pi-edit" }
pi-walker = { path = "../crates/pi-walker" }
pi-shell = { path = "../crates/pi-shell", optional = true }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
harvest-protocol = { path = "../crates/harvest-protocol" }
harvest-terminal = { path = "../crates/harvest-terminal" }
toml.workspace = true
ureq = { version = "2.12.1", default-features = false, features = [
  "json",
  "tls",
] }
handlebars = { version = "6.4.4", default-features = false }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"

[build-dependencies]
semver = "1.0"
toml.workspace = true

[lints]
workspace = true
