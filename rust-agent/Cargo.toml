[package]
name = "harvest-omp"
version.workspace = true
edition.workspace = true
description = "Rust coding agent for Harvest"
repository = "https://github.com/Sanidhya14321/harvest"
homepage = "https://github.com/Sanidhya14321/harvest"
documentation = "https://github.com/Sanidhya14321/harvest/tree/main/rust-agent"
readme = "README.md"
license.workspace = true
keywords = ["agent", "cli", "coding", "harvest", "llm"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/", "target/"]

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/v{ version }/omp-{ target-family }-{ target-arch }{ binary-ext }"

[package.metadata.deb]
maintainer = "Harvest Contributors <harvest@users.noreply.github.com>"
copyright = "2026, Harvest Contributors"
extended-description = "omp is the Rust coding agent for Harvest. It reads and edits a workspace, runs shell commands, and talks to an OpenAI-compatible model."
section = "devel"
priority = "optional"
revision = ""

[[bin]]
name = "omp"
path = "src/main.rs"

[[bin]]
name = "harvest"
path = "src/bin/harvest.rs"

[features]
default = ["core"]
core = []
full = ["dep:pi-shell", "dep:tokio", "dep:flume"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap.workspace = true
clap_complete = "4.5.65"
clap_mangen = "0.2.31"
flume = { workspace = true, optional = true }
harvest-brain = { path = "../crates/harvest-brain" }
harvest-runtime = { path = "../crates/harvest-runtime" }
pi-edit = { path = "../crates/pi-edit" }
pi-shell = { path = "../crates/pi-shell", optional = true }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, optional = true }
toml.workspace = true
ureq = { version = "2.12.1", default-features = false, features = [
  "json",
  "tls",
] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"

[lints]
workspace = true
