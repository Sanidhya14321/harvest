# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: Pulkitxm.Omp
PackageVersion: "@VERSION@"
InstallerType: zip
NestedInstallerType: portable
Commands:
  - omp
  - harvest
ReleaseDate: "@RELEASE_DATE@"
Installers:
  - Architecture: x64
    NestedInstallerFiles:
      - RelativeFilePath: omp.exe
        PortableCommandAlias: omp
      - RelativeFilePath: harvest.exe
        PortableCommandAlias: harvest
    InstallerUrl: https://github.com/Sanidhya14321/harvest/releases/download/v@VERSION@/@ASSET_WINDOWS_X64@
    InstallerSha256: "@SHA256_WINDOWS_X64@"
  - Architecture: arm64
    NestedInstallerFiles:
      - RelativeFilePath: omp.exe
        PortableCommandAlias: omp
      - RelativeFilePath: harvest.exe
        PortableCommandAlias: harvest
    InstallerUrl: https://github.com/Sanidhya14321/harvest/releases/download/v@VERSION@/@ASSET_WINDOWS_ARM64@
    InstallerSha256: "@SHA256_WINDOWS_ARM64@"
ManifestType: installer
ManifestVersion: 1.12.0
